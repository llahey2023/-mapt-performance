<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>MAPT Performance 1.5</title><style>
:root{color-scheme:dark;--bg:#0d0f13;--card:#1b1e25;--gold:#e5bb67;--text:#f4f4f5;--muted:#a5a8b0;--line:#333741}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px 20px 12px;display:flex;align-items:center;gap:12px}.mark{color:var(--gold);font-size:34px}.brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:var(--gold)}small,.muted{color:var(--muted)}main{max-width:700px;margin:auto;padding:10px 18px 110px}h1{font-size:29px;margin:8px 0 4px}h2{font-size:19px;margin:24px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric strong{font-size:24px;color:var(--gold);display:block;margin-top:9px}.metric small{font-size:12px}.primary{background:var(--gold);color:#181818;border:0;font-weight:800;border-radius:12px;padding:13px 17px}.secondary{background:#2a2e37;color:var(--text);border:1px solid #484d57;border-radius:12px;padding:11px 14px}.danger{color:#ff9898}button:disabled{opacity:.4}input,select{background:#101217;color:white;border:1px solid #454a54;border-radius:9px;padding:10px;min-width:0;width:100%}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.stack{display:flex;flex-direction:column;gap:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#16191f;border-top:1px solid #343841;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:2}.nav button{background:none;border:0;color:var(--muted);font-size:12px;min-width:65px}.nav button.active{color:var(--gold);font-weight:800}.nav .ico{display:block;font-size:22px;margin-bottom:4px}.tag{background:#363123;color:var(--gold);padding:5px 9px;border-radius:99px;font-size:12px}.exercise{border-top:1px solid var(--line);padding:14px 0}.set{display:grid;grid-template-columns:34px 1fr 1fr 62px;gap:8px;align-items:center;margin:8px 0}.set input{text-align:center;padding:9px 3px}.set button{border:1px solid #60666e;background:#282c33;color:white;border-radius:9px;height:40px}.set button.done{background:#45644b;border-color:#85be8c}.notice{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.chart{display:flex;gap:7px;align-items:end;height:160px;border-bottom:1px solid #555;margin:15px 0 8px}.bar{flex:1;min-width:7px;background:linear-gradient(#f4d492,#a67b32);border-radius:5px 5px 0 0}.chart-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:6px 10px;background:#2d313b;border-radius:8px;font-size:12px;margin:3px}.empty{text-align:center;padding:25px 10px;color:var(--muted)}

/* MAPT 1.1 */
.guide-link{border:1px solid #6e5731;color:var(--gold);background:#28241d;border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px}
.guide-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.figure{background:#11151c;border:1px solid #343943;border-radius:14px;padding:8px;text-align:center}.figure svg{width:100%;max-height:240px}
.coach-list{padding-left:21px;line-height:1.65}.coach-list li{margin:7px 0}.coach-label{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:800}.search{margin:12px 0}.guide-visual{background:#11151c;border-radius:15px;padding:14px;margin:12px 0}.guide-visual svg{width:100%;max-height:190px}.guide-visual p{font-size:12px;color:var(--muted);margin-bottom:0}.hint{border-left:3px solid var(--gold);padding:10px 12px;background:#29251e;border-radius:6px;font-size:13px;line-height:1.5}

/* MAPT 1.2 */
.fav-btn{border:1px solid #65502c;background:#29251c;color:var(--gold);border-radius:12px;padding:10px 13px;min-width:45px;font-size:21px;cursor:pointer}.fav-btn[aria-pressed="true"]{background:#e5bb67;color:#101115}.coach-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:15px 0}.filter-btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 13px;border-radius:12px}.filter-btn.selected{border-color:var(--gold);color:var(--gold)}.coach-item{display:flex;gap:10px;align-items:center;justify-content:space-between}.coach-item>div:first-child{min-width:0;flex:1}.coach-item b{overflow-wrap:anywhere}.micro-chart{display:flex;align-items:flex-end;height:115px;gap:8px;padding:14px 4px 0;border-bottom:1px solid var(--line)}.micro-chart .mini-bar{background:var(--gold);flex:1;max-width:35px;border-radius:5px 5px 0 0;min-height:2px}.video-placeholder{border:1px dashed #786139;background:#12151a;border-radius:16px;padding:25px 17px;text-align:center}.video-placeholder .play{font-size:45px;color:var(--gold)}.small-muted{font-size:13px;color:var(--muted)}

/* MAPT 1.2.1: navigation accessibility and MAPT brand logo */
.mapt-logo{width:46px;height:46px;object-fit:contain;flex:0 0 46px;border-radius:50%;background:#050505}
.guide-top{position:sticky;top:0;z-index:6;background:rgba(13,15,19,.97);padding:12px 0;flex-wrap:wrap;gap:10px}
.guide-top .secondary{min-height:52px;min-width:108px;font-size:16px;font-weight:700;border-color:var(--gold);color:var(--gold)}
.guide-top .tag{max-width:100%}
.back-button{display:block!important;width:100%;min-height:58px!important;border:1px solid #9b793d!important;background:#29251d!important;color:var(--gold)!important;font-weight:800!important;font-size:17px!important;border-radius:14px!important;padding:12px 16px!important;touch-action:manipulation}
.nav:has(.back-button){padding:12px 18px max(14px,env(safe-area-inset-bottom))}
@media(max-width:390px){.brand{font-size:17px;letter-spacing:1px}.mapt-logo{width:40px;height:40px;flex-basis:40px}}

.previous-card{margin:12px 0;padding:12px;border-radius:12px;background:#11151b;border:1px solid #66512e;line-height:1.6}.previous-card b{color:var(--gold)}.previous-line{font-weight:650;font-size:14px;overflow-wrap:anywhere}.set input{min-width:0}.set button{min-width:42px;min-height:44px}.row{flex-wrap:wrap}

/* MAPT 1.4 — Fitness Academy */
.academy-search{font-size:16px;padding:14px;border-color:#a78548}.academy-chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}.academy-chips button{white-space:nowrap;border:1px solid #555;background:#262a32;color:#f5f5f5;border-radius:22px;padding:9px 12px}.academy-chips button.selected{background:#e5bb67;color:#181818;border-color:#e5bb67;font-weight:800}.academy-item{display:flex;align-items:center;justify-content:space-between;gap:8px}.academy-item button{min-height:44px}.academy-star{border:1px solid #6d5b38;border-radius:11px;background:#282720;color:#e5bb67;font-size:24px;width:48px;height:48px;flex-shrink:0}.academy-term{border:0;background:none;color:#fff;text-align:left;flex:1;padding:8px 0}.academy-term b{font-size:17px}.academy-detail p{line-height:1.6}.academy-caption{color:#e5bb67;font-size:12px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;margin-top:15px}.academy-back{width:100%;min-height:48px}.academy-related{display:flex;flex-wrap:wrap;gap:8px}.academy-related button{border:1px solid #6d5b38;border-radius:12px;background:#292922;color:#f1d194;padding:10px}.academy-entry{scroll-margin-top:12px}

/* MAPT 1.5 — Tap to Learn */
.learn-trigger{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;border:1px solid #b68b42;background:#302719;color:#f4ca7b;border-radius:50%;width:25px;height:25px;min-width:25px;padding:0;margin:0 3px 0 5px;font-size:14px;font-weight:800;cursor:pointer;touch-action:manipulation}
.learn-trigger:focus-visible,.learn-close:focus-visible{outline:3px solid #e5bb67;outline-offset:3px}
.learn-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.learn-dialog{width:min(100%,460px);max-height:85dvh;overflow:auto;background:#1b1e25;border:1px solid #a58043;border-radius:18px;padding:20px;box-shadow:0 20px 70px #000b}
.learn-dialog h2{margin:10px 0;color:#e5bb67}.learn-dialog p{line-height:1.55}.learn-close{min-width:46px;min-height:46px;border-radius:10px;border:1px solid #a58043;background:#302719;color:#e5bb67;font-weight:800}
.learn-dialog .learn-more{display:block;width:100%;min-height:48px;margin-top:15px}.learn-tip{border-color:#9a793f}.learn-tip h2{color:#e5bb67}.learn-tip p{line-height:1.6}

const KEY='mapt-performance-v1';const starter=[{id:'push',name:'Push Day',items:[{id:'bench',sets:3,reps:8,weight:80},{id:'ohp',sets:3,reps:8,weight:50},{id:'incline',sets:3,reps:10,weight:30}]},{id:'legs',name:'Leg Day',items:[{id:'squat',sets:4,reps:6,weight:120},{id:'rdl',sets:3,reps:10,weight:36},{id:'legpress',sets:3,reps:12,weight:155}]}];const library=[['bench','Barbell Bench Press','Chest',1],['ohp','Overhead Press','Shoulders',1],['incline','Incline Dumbbell Press','Chest',2],['squat','Barbell Squat','Legs',1],['rdl','Dumbbell Romanian Deadlift','Legs',2],['legpress','Leg Press','Legs',1],['deadlift','Deadlift','Back',1],['latpulldown','Lat Pulldown','Back',1],['row','Seated Cable Row','Back',1],['curl','Dumbbell Curl','Arms',2],['pushdown','Triceps Pushdown','Arms',1],['lateral','Dumbbell Lateral Raise','Shoulders',2]].map(([id,name,group,mult])=>({id,name,group,mult}));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{programs:starter,library,history:[],active:null};state.library ||= library;state.programs ||= starter;state.history ||= [];let tab='home',editing=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),ex=id=>state.library.find(e=>e.id===id)||{name:'Unknown',mult:1,group:'Other'},fmt=n=>Number(n||0).toLocaleString('en-AU',{maximumFractionDigits:1}),uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function volume(w){return w.items.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done?Number(s.reps)*Number(s.weight)*ex(e.id).mult:0),0),0)}function setsDone(w){return w.items.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function navigate(t){if(t==='library'){renderExerciseLibrary();return}if(t==='guide'){renderExerciseLibrary();return}tab=t;render()}function render(){let tabs=[['home','⌂','Home'],['programs','▤','Programs'],['train','◉','Train'],['analytics','▥','Analytics'],['profile','⚙','Profile']];$('nav').innerHTML=tabs.map(([id,icon,name])=>`<button class="${tab===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${icon}</span>${name}</button>`).join('');({home,programs,train,analytics,profile})[tab]();}function heading(title,subtitle=''){return `<h1>${title}</h1><p class="muted">${subtitle}</p>`}function home(){let hist=state.history,now=Date.now(),week=hist.filter(w=>now-new Date(w.date).getTime()<7*864e5),vol=week.reduce((a,w)=>a+volume(w),0),all=hist.reduce((a,w)=>a+setsDone(w),0);$('app').innerHTML=heading('Your performance','Build strength. See the progress.')+`<div class="grid"><div class="card metric"><small>7-day volume</small><strong>${fmt(vol)} kg</strong></div><div class="card metric"><small>7-day sessions</small><strong>${week.length}</strong></div><div class="card metric"><small>Completed workouts</small><strong>${hist.length}</strong></div><div class="card metric"><small>Sets logged</small><strong>${all}</strong></div></div><div class="card"><h2 style="margin-top:0">Ready to train?</h2><p class="muted">Start a saved routine or continue where you left off.</p><button class="primary" onclick="navigate('train')">${state.active?'Continue workout':'Start workout'} →</button></div><h2>Recent workouts</h2>${hist.length?hist.slice(-5).reverse().map(w=>`<div class="card row"><div><b>${esc(w.name)}</b><br><small>${new Date(w.date).toLocaleDateString('en-AU')} · ${setsDone(w)} sets</small></div><strong style="color:var(--gold)">${fmt(volume(w))} kg</strong></div>`).join(''):'<div class="card empty">No workouts yet. Your first session will appear here.</div>'}`}
function programs(){let options=state.library.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.group)})</option>`).join('');$('app').innerHTML=heading('My programs','Build your routine, your way.')+`<div class="card"><label>New program name</label><div class="row"><input id="newProgram" placeholder="e.g. Upper Body"><button class="primary" onclick="addProgram()">Add</button></div></div>`+state.programs.map(p=>`<div class="card"><div class="row"><h2 style="margin:0">${esc(p.name)}</h2><button class="secondary danger" onclick="deleteProgram('${p.id}')">Delete</button></div>${p.items.map((item,i)=>`<div class="exercise"><b>${esc(ex(item.id).name)}</b><div class="row"><div style="flex:1"><label>Sets</label><input type="number" min="1" max="15" value="${item.sets}" onchange="editItem('${p.id}',${i},'sets',this.value)"></div><div style="flex:1"><label>Reps</label><input type="number" min="1" value="${item.reps}" onchange="editItem('${p.id}',${i},'reps',this.value)"></div><div style="flex:1"><label>kg / unit</label><input type="number" min="0" step="0.5" value="${item.weight}" onchange="editItem('${p.id}',${i},'weight',this.value)"></div><button class="secondary danger" style="margin-top:22px" onclick="removeItem('${p.id}',${i})">×</button></div></div>`).join('')}<label>Add exercise</label><div class="row"><select id="sel-${p.id}">${options}</select><button class="secondary" onclick="addItem('${p.id}')">Add</button></div><p><button class="primary" onclick="start('${p.id}')">Start this workout →</button></p></div>`).join('')+`<div class="card"><h2 style="margin:0">Custom exercise</h2><label>Name</label><input id="customName" placeholder="Exercise name"><label>Muscle group</label><select id="customGroup"><option>Chest</option><option>Back</option><option>Legs</option><option>Shoulders</option><option>Arms</option><option>Core</option><option>Other</option></select><label>Equipment</label><select id="customMult"><option value="1">Barbell / machine / total weight</option><option value="2">Two dumbbells (weight per hand)</option></select><p><button class="secondary" onclick="addCustom()">Save exercise</button></p></div>`}
function addProgram(){let name=$('newProgram').value.trim();if(!name)return alert('Enter a program name');state.programs.push({id:uid(),name,items:[]});save();render()}function deleteProgram(id){if(!confirm('Delete this program? Saved workout history will remain.'))return;state.programs=state.programs.filter(p=>p.id!==id);save();render()}function editItem(id,i,key,v){let item=state.programs.find(p=>p.id===id).items[i];item[key]=Math.max(key==='weight'?0:1,Number(v)||0);save()}function removeItem(id,i){state.programs.find(p=>p.id===id).items.splice(i,1);save();render()}function addItem(id){state.programs.find(p=>p.id===id).items.push({id:$('sel-'+id).value,sets:3,reps:10,weight:0});save();render()}function addCustom(){let name=$('customName').value.trim();if(!name)return alert('Enter an exercise name');state.library.push({id:uid(),name,group:$('customGroup').value,mult:Number($('customMult').value)});save();render()}
function start(id){if(state.active&&!confirm('Discard your current unfinished workout?'))return;let p=state.programs.find(p=>p.id===id);state.active={id:uid(),name:p.name,started:new Date().toISOString(),items:p.items.map(item=>({id:item.id,sets:Array.from({length:item.sets},()=>({reps:item.reps,weight:item.weight,done:false}))}))};save();navigate('train')}function train(){if(!state.active){$('app').innerHTML=heading('Start training','Choose a routine to begin.')+(state.programs.length?state.programs.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><br><small>${p.items.length} exercises</small></div><button class="primary" onclick="start('${p.id}')">Start</button></div>`).join(''):'<div class="card empty">Create a program first.</div>');return}let w=state.active;$('app').innerHTML=heading(w.name,'Active workout · log completed sets')+`<div class="card row"><div><small>Completed volume</small><br><strong style="font-size:23px;color:var(--gold)">${fmt(volume(w))} kg</strong></div><span class="tag">${setsDone(w)} sets logged</span></div>`+w.items.map((item,i)=>`<div class="card"><h2 style="margin:0">${esc(ex(item.id).name)}</h2><small>${esc(ex(item.id).group)} · ${ex(item.id).mult===2?'Weight per dumbbell':'Total loaded weight'}</small><div class="set"><small>Set</small><small>Reps</small><small>Weight kg</small><small>Done</small></div>${item.sets.map((s,j)=>`<div class="set"><b>${j+1}</b><input aria-label="Reps" type="number" min="0" value="${s.reps}" onchange="setValue(${i},${j},'reps',this.value)"><input aria-label="Weight" type="number" min="0" step="0.5" value="${s.weight}" onchange="setValue(${i},${j},'weight',this.value)"><button class="${s.done?'done':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="secondary" onclick="addSet(${i})">+ Add set</button></div>`).join('')+`<div class="card"><div class="row"><button class="secondary danger" onclick="discard()">Discard</button><button class="primary" onclick="finish()">Finish workout ✓</button></div></div>`}function setValue(i,j,k,v){state.active.items[i].sets[j][k]=Math.max(0,Number(v)||0);save();render()}function toggleSet(i,j){let s=state.active.items[i].sets[j];s.done=!s.done;save();render()}function addSet(i){let sets=state.active.items[i].sets,prev=sets.at(-1)||{reps:10,weight:0};sets.push({...prev,done:false});save();render()}function discard(){if(confirm('Discard this workout?')){state.active=null;save();render()}}function finish(){if(!setsDone(state.active))return alert('Complete at least one set first');let w={...state.active,date:new Date().toISOString()};state.history.push(w);state.active=null;save();navigate('home');alert('Workout saved! Great work.')}function analytics(){let hist=state.history;let days=28,now=Date.now(),weeks=Array.from({length:4},(_,i)=>{let start=now-(4-i)*7*864e5,end=start+7*864e5;return hist.filter(w=>{let t=new Date(w.date).getTime();return t>=start&&t<end}).reduce((a,w)=>a+volume(w),0)}),max=Math.max(1,...weeks);let exerciseIds=[...new Set(hist.flatMap(w=>w.items.map(e=>e.id)))];$('app').innerHTML=heading('Analytics','Your training, measured over time.')+`<div class="card"><h2 style="margin:0">Weekly training volume</h2><small>Last four 7-day periods · kg</small><div class="chart">${weeks.map(v=>`<div class="bar" title="${fmt(v)} kg" style="height:${Math.max(2,v/max*100)}%"></div>`).join('')}</div><div class="chart-labels">${weeks.map((v,i)=>`<span>W${i+1}<br>${fmt(v)} kg</span>`).join('')}</div></div><div class="card"><h2 style="margin:0">Strength by exercise</h2>${exerciseIds.length?`<label>Select exercise</label><select id="analyticsExercise" onchange="strength(this.value)">${exerciseIds.map(id=>`<option value="${id}">${esc(ex(id).name)}</option>`).join('')}</select><div id="strengthOutput"></div>`:'<p class="empty">Log a workout to see strength trends.</p>'}</div><p class="notice">Training volume = completed reps × recorded load. For paired dumbbells, the app counts both dumbbells. Es function previousExercise(id){for(let w of [...state.history].reverse()){let item=w.items.find(x=>x.id===id&&x.sets.some(s=>s.done));if(item)return {date:w.date,sets:item.sets.filter(s=>s.done)};}return null}
function previousText(id){let p=previousExercise(id);if(!p)return '<span class="muted">First recorded session — set your baseline.</span>';let date=new Date(p.date).toLocaleDateString('en-AU');let sets=p.sets.map(s=>`${s.weight} kg × ${s.reps}`).join(' · ');return `<small>Last trained ${date}</small><div class="previous-line">${esc(sets)}</div>`}
function currentExerciseVolume(item){return item.sets.filter(s=>s.done).reduce((a,s)=>a+s.weight*s.reps*ex(item.id).mult,0)}
function previousExerciseVolume(id){let p=previousExercise(id);return p?p.sets.reduce((a,s)=>a+s.weight*s.reps*ex(id).mult,0):null}
function setDoneFast(i,j){let s=state.active.items[i].sets[j];s.done=!s.done;save();train()}
function changeWorkoutValue(i,j,k,v){let n=Number(v);if(!Number.isFinite(n)||n<0)return;state.active.items[i].sets[j][k]=n;save();let el=document.getElementById('currentVolume');if(el)el.textContent=fmt(volume(state.active))+' kg'}
train=function(){if(!state.active){$('app').innerHTML=heading('Start training','Choose a routine to begin.')+(state.programs.length?state.programs.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><br><small>${p.items.length} exercises</small></div><button class="primary" onclick="start('${p.id}')">Start</button></div>`).join(''):'<div class="card empty">Create a program first.</div>');return}
let w=state.active;$('app').innerHTML=heading(w.name,'Log sets · compare with your last session')+`<div class="card row"><div><small>Completed volume</small><br><strong id="currentVolume" style="font-size:23px;color:var(--gold)">${fmt(volume(w))} kg</strong></div><span class="tag">${setsDone(w)} sets logged</span></div>`+w.items.map((item,i)=>{let prior=previousExerciseVolume(item.id),now=currentExerciseVolume(item);return `<div class="card"><div class="row"><h2 style="margin:0">${esc(ex(item.id).name)}</h2><button class="secondary" onclick="guide('${item.id}','train')" aria-label="Exercise guide">ⓘ Guide</button></div><small>${esc(ex(item.id).group)} · ${ex(item.id).mult===2?'kg per dumbbell':'total loaded kg'}</small><div class="previous-card"><b>↶ Previous performance</b><br>${previousText(item.id)}</div><div class="set"><small>Set</small><small>Reps</small><small>Weight kg</small><small>Done</small></div>${item.sets.map((s,j)=>`<div class="set"><b>${j+1}</b><input aria-label="Reps for set ${j+1}" inputmode="numeric" type="number" min="0" value="${s.reps}" onchange="changeWorkoutValue(${i},${j},'reps',this.value)"><input aria-label="Weight for set ${j+1}" inputmode="decimal" type="number" min="0" step="0.5" value="${s.weight}" onchange="changeWorkoutValue(${i},${j},'weight',this.value)"><button aria-label="Mark set ${j+1} ${s.done?'incomplete':'complete'}" class="${s.done?'done':''}" onclick="setDoneFast(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<div class="row" style="margin-top:10px"><button class="secondary" onclick="addSet(${i})">+ Add set</button><small>${prior===null?'No previous volume':`Previous: ${fmt(prior)} kg · Today: ${fmt(now)} kg`}</small></div></div>`}).join('')+`<div class="card"><div class="row"><button class="secondary danger" onclick="discard()">Discard</button><button class="primary" onclick="finish()">Finish workout ✓</button></div></div>`}
const analytics13=analytics;
analytics=function(){analytics13();let hist=state.history,now=Date.now();let last=hist.filter(w=>now-new Date(w.date).getTime()<=28*864e5),before=hist.filter(w=>{let d=now-new Date(w.date).getTime();return d>28*864e5&&d<=56*864e5});let v=last.reduce((a,w)=>a+volume(w),0),old=before.reduce((a,w)=>a+volume(w),0),days=new Set(last.map(w=>new Date(w.date).toLocaleDateString('en-CA'))).size;let diff=old?((v-old)/old*100):null;let info=`<div class="card"><h2 style="margin:0 0 12px">28-day performance snapshot</h2><div class="grid"><div class="metric"><small>Sessions</small><strong>${last.length}</strong></div><div class="metric"><small>Active training days</small><strong>${days}</strong></div><div class="metric"><small>Completed sets</small><strong>${last.reduce((a,w)=>a+setsDone(w),0)}</strong></div><div class="metric"><small>Total volume</small><strong>${fmt(v)} kg</strong></div></div><p class="notice">${diff===null?'Complete workouts across two consecutive 28-day periods to see a volume comparison.':`Volume vs preceding 28 days: <b>${diff>=0?'+':''}${diff.toFixed(1)}%</b>.`} Volume alone does not measure fitness progress or recovery.</p></div>`;$('app').insertAdjacentHTML('afterbegin',info)};

r.","example":"Barbell squat.","detail":"Can permit high total loading.","related":["Sets","Repetitions (reps)","Working set"]},{"term":"Stability","category":"Anatomy","simple":"The ability to control body position or a joint during movement.","example":"Keeping your trunk controlled in a split squat.","detail":"Stability requirements vary by exercise.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Mobility","category":"Anatomy","simple":"The ability to move through a usable range with control.","example":"Ankle mobility can affect squat positioning.","detail":"Not identical to flexibility.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Flexibility","category":"Anatomy","simple":"The available length or passive movement range of muscles and tissues.","example":"Stretching the hamstrings.","detail":"Flexibility alone does not guarantee control.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Core","category":"Anatomy","simple":"Muscles around the trunk and pelvis that help support and move the body.","example":"Bracing during a deadlift.","detail":"Includes more than just the abdominal muscles.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Bracing","category":"Anatomy","simple":"Creating trunk tension to help control the spine under load.","example":"Tightening the trunk before a heavy squat.","detail":"Breathing and bracing should match the task and individual.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Hip hinge","category":"Anatomy","simple":"A movement where the hips bend while the trunk stays controlled.","example":"Romanian deadlift.","detail":"Different from primarily bending at the knees.","related":["Concentric contraction","Eccentric contraction","Isometric contraction"]},{"term":"Aerobic exercise","category":"C ing calmly.","example":"Measuring pulse after waking.","detail":"Trends may be more informative than a single reading.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Maximum heart rate","category":"Cardio","simple":"The highest heart rate you can reach during maximal effort.","example":"Used to help define training zones.","detail":"Age-based formulas are only rough estimates.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Heart rate zones","category":"Cardio","simple":"Intensity bands based on heart rate.","example":"An easy ride in a lower heart rate zone.","detail":"Zone boundaries depend on the method used.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Zone 2","category":"Cardio","simple":"A commonly used label for relatively easy aerobic training.","example":"Cycling at a pace where conversation remains possible.","detail":"Definitions vary across five-zone and other models.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Lactate","category":"Physiology","simple":"A substance produced during energy metabolism, including during exercise.","example":"Blood lactate often rises as exercise intensity increases.","detail":"Lactate is also a usable fuel, not simply waste.","related":["ATP","Phosphagen system","Glycolysis"]},{"term":"Lactate threshold","category":"Cardio","simple":"An exercise intensity around which blood lactate begins rising more quickly.","example":"A hard but sustainable running pace.","detail":"Exact thresholds depend on the testing method.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Anaerobic threshold","category":"Cardio","simple":"A term often used for a high exercise intensity near a rapid rise in lactate or ventilation.","example":"A sustained hard cycling effort.","detail":"Definitions vary; it is not a precise switch between energy systems.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Interval training","category":"Cardio","simple":"Alternating periods of harder work and recovery.","example":"One minute fast, two minutes easy, repeated.","detail":"Intervals can target different fitness qualities.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"HIIT","category":"Cardio","simple":"High-Intensity Interval Training: repeated hard efforts with recovery periods.","example":"Six hard cycling intervals with easy pedalling between.","detail":"Hard intervals need appropriate recovery.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Steady-state cardio","category":"Cardio","simple":"Continuous exercise at a fairly consistent intensity.","example":"A 30-minute easy jog.","detail":"Useful for building aerobic capacity.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Aerobic capacity","category":"Cardio","simple":"The ability to deliver and use oxygen to support exercise.","example":"Improving endurance through regular cycling.","detail":"Related to but not identical to VO₂ max.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Anaerobic capacity","category":"Cardio","simple":"The ability to sustain high-intensity work supported by rapid energy pathways.","example":"Repeated short uphill sprints.","detail":"Performance also depends on technique and recovery.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"ATP","category":"Physiology","simple":"Adenosine triphosphate: the immediate energy currency used by cells.","example":"Muscle contraction uses ATP.","detail":"ATP is continually regenerated during activity.","related":["Lactate","Phosphagen system","Glycolysis"]},{"term":"Phosphagen system","category":"Physiology","simple":"A rapid energy system using stored ATP and phosph ,"detail":"Different from maximal strength alone.","related":["Hypertrophy","Muscular strength","Muscular endurance"]},{"term":"Explosive strength","category":"Strength","simple":"The ability to develop force rapidly.","example":"A vertical jump.","detail":"Requires appropriate technique and progression.","related":["Hypertrophy","Muscular strength","Muscular endurance"]},{"term":"Plyometrics","category":"Training methods","simple":"Fast movements using a rapid stretch followed by contraction.","example":"Hops and jumps.","detail":"Progress impact and landing demands gradually.","related":["Sets","Repetitions (reps)","Working set"]},{"term":"Cardio warm-up","category":"Cardio","simple":"Light movement used to prepare for more demanding activity.","example":"Five minutes of easy cycling before intervals.","detail":"Should be tailored to the session.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Cooldown","category":"Recovery","simple":"A period of gradually reducing activity after exercise.","example":"Easy walking after a hard run.","detail":"May help transition to rest but is not a cure for soreness.","related":["DOMS","Recovery","Deload"]},{"term":"Hydration","category":"Nutrition","simple":"Maintaining adequate body water for normal function.","example":"Drinking fluids around exercise according to conditions and thirst.","detail":"Needs change with heat and sweat losses.","related":["Protein","Carbohydrate","Fat"]},{"term":"Mechanical tension","category":"Physiology","simple":"Force experienced by muscle fibres when they contract against resistance.","example":"Challenging controlled resistance training produces mechanical tension.","detail":"An important contributor to muscle adaptation.","related":["Lactate","ATP","Phosphagen system"]},{"term":"Muscle protein synthesis","category":"Physiology","simple":"The process of building new muscle proteins.","example":"Resistance training and protein intake can stimulate it.","detail":"Muscle growth reflects changes over time, not one isolated spike.","related":["Lactate","ATP","Phosphagen system"]},{"term":"Metabolic conditioning","category":"Cardio","simple":"Training designed to challenge energy production and work capacity.","example":"Repeated rowing and kettlebell intervals.","detail":"Training effects depend on intensity and exercise selection.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Cadence","category":"Cardio","simple":"The rate of repeated movements such as steps or pedal revolutions.","example":"Running at 170 steps per minute.","detail":"An appropriate cadence varies by person and speed.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Resting metabolic rate (RMR)","category":"Nutrition","simple":"The energy your body uses at rest to maintain essential functions.","example":"A resting metabolism estimate of 1,800 kcal/day.","detail":"Estimates vary and are not total daily energy needs.","related":["Protein","Carbohydrate","Fat"]},{"term":"Basal metabolic rate (BMR)","category":"Nutrition","simple":"Energy required for essential bodily functions under tightly controlled resting conditions.","example":"BMR is one component of daily energy expenditure.","detail":"BMR and RMR are related but measured differently.","related":["Protein","Carbohydrate","Fat"]},{"term":"NEAT","category":"Nutrition","simple":"Non-exercise activity thermogenesis: energy used in everyday movement outside planned exercise.","example":"Walking around at work or doing housework.","detail":"Can vary substantially between days and people.","related":["Protein","Carbohydrate","Fat"]},{"term":"Aerobic base","category":"Cardio","simple":"A foundation of endurance built through regular manageable aerobic activity.","example":"Consistent easy runs over several weeks.","detail":"Helps support longer or harder training.","related":["Aerobic exercise","Anaerobic exercise","Cardiovascular fitness"]},{"term":"Work capacity","category":"Measurement","simple":"How much useful physical work you can perform and recover from.","example":"Completing more quality sets at a similar effort.","detail":"Highly specific to the activity being measured.","related":["One-repetition maximum (1RM)","Estimated 1RM","Training volume"]}];
const ACADEMY_FAV_KEY='mapt-academy-favourites-v1';
let academyFav=[];try{const x=JSON.parse(localStorage.getItem(ACADEMY_FAV_KEY)||'[]');if(Array.isArray(x))academyFav=x.filter(v=>typeof v==='string')}catch(e){}
let academyQuery='',academyCategory='All',academyOnlyFav=false,academyCurrent=null;
function academySaveFav(){try{localStorage.setItem(ACADEMY_FAV_KEY,JSON.stringify(academyFav))}catch(e){alert('Could not save dictionary favourites.')}}
function academyToggleFav(name){academyFav=academyFav.includes(name)?academyFav.filter(x=>x!==name):[...academyFav,name];academySaveFav();if(academyCurrent)academyDetail(academyCurrent);else academyList()}
function academyChrome(){tab='academy';$('nav').innerHTML=`<button class="back-button" onclick="navigate('home')">← Back to Home</button>`}
function academyOpen(){academyCurrent=null;academyQuery='';academyCategory='All';academyOnlyFav=false;academyList()}
function academyList(){academyCurrent=null;academyChrome();let q=academyQuery.toLocaleLowerCase().trim();let results=ACADEMY_TERMS.filter(x=>(academyCategory==='All'||x.category===academyCategory)&&(!academyOnlyFav||academyFav.includes(x.term))&&(!q||(x.term+' '+x.simple+' '+x.category+' '+x.example).toLocaleLowerCase().includes(q))).sort((a,b)=>a.term.localeCompare(b.term));let cats=['All',...new Set(ACADEMY_TERMS.map(x=>x.category))];$('app').innerHTML=heading('Fitness Academy','Understand your training. Improve your performance.')+`<div class="card"><b>📖 Fitness Dictionary</b><p class="notice">${ACADEMY_TERMS.length} plain-English fitness terms with examples and extra context. Available without a separate internet connection after the app loads.</p><input id="academySearch" class="academy-search" type="search" placeholder="Search e.g. hypertrophy, aerobic, RPE" aria-label="Search fitness dictionary" value="${esc(academyQuery)}" oninput="academySearchChanged(this.value)"><div class="academy-chips">${cats.map(c=>`<button class="${academyCategory===c?'selected':''}" onclick="academyCategory=${JSON.stringify(c).replace(/"/g,'&quot;')};academyList()">${esc(c)}</button>`).join('')}</div><button class="secondary" style="margin-top:8px" onclick="academyOnlyFav=!academyOnlyFav;academyList()">${academyOnlyFav?'★ Showing saved terms':'☆ Show saved terms'} (${academyFav.length})</button></div><p class="muted">${results.length} matching terms · A–Z</p><div id="academyResults">${academyResultHtml(results)}</div><p class="notice">Educational information only. Exercise recommendations should account for your circumstances and any health advice you receive.</p>`}
function academyResultHtml(results){return results.map(x=>`<div class="card academy-item"><button class="academy-term" onclick="academyDetail(${JSON.stringify(x.term).replace(/"/g,'&quot;')})"><b>${esc(x.term)}</b><br><small>${esc(x.category)} · ${esc(x.simple)}</small></button><button class="academy-star" aria-label="${academyFav.includes(x.term)?'Remove':'Save'} ${esc(x.term)}" onclick="academyToggleFav(${JSON.stringify(x.term).replace(/"/g,'&quot;')})">${academyFav.includes(x.term)?'★':'☆'}</button></div>`).join('')||'<div class="card empty">No matching terms. Try another search or category.</div>'}
function academySearchChanged(value){academyQuery=value;let q=value.toLocaleLowerCase().trim();let results=ACADEMY_TERMS.filter(x=>(academyCategory==='All'||x.category===academyCategory)&&(!academyOnlyFav||academyFav.includes(x.term))&&(!q||(x.term+' '+x.simple+' '+x.category+' '+x.example).toLocaleLowerCase().includes(q))).sort((a,b)=>a.term.localeCompare(b.term));$('academyResults').innerHTML=academyResultHtml(results)}
function academyDetail(name){let x=ACADEMY_TERMS.find(t=>t.term===name);if(!x)return academyList();academyCurrent=name;academyChrome();$('app').innerHTML=`<button class="secondary academy-back" onclick="academyList()">← Back to dictionary</button><div class="card academy-detail academy-entry"><div class="row"><span class="tag">${esc(x.category)}</span><button class="academy-star" aria-label="Save or remove favourite" onclick="academyToggleFav(${JSON.stringify(x.term).replace(/"/g,'&quot;')})">${academyFav.includes(name)?'★':'☆'}</button></div><h1>${esc(x.term)}</h1><div class="academy-caption">In plain English</div><p>${esc(x.simple)}</p><div class="academy-caption">Gym example</div><p>${esc(x.example)}</p>${coachLevel!=='Beginner'?`<div class="academy-caption">A little more detail</div><p>${esc(x.detail)}</p>`:`<details><summary style="color:var(--gold);padding:10px 0">Learn a little more</summary><p>${esc(x.detail)}</p></details>`}<div class="academy-caption">Related concepts</div><div class="academy-related">${x.related.map(n=>`<button onclick="academyDetail(${JSON.stringify(n).replace(/"/g,'&quot;')})">${esc(n)} →</button>`).join('')}</div></div><button class="secondary academy-back" onclick="academyList()">← Back to dictionary</button>`;window.scrollTo(0,0)}
// Keep the established five-tab iPhone layout and expose Learn from Home, Programs and Profile.
const academyHomeOriginal=home;home=function(){academyHomeOriginal();$('app').insertAdjacentHTML('afterbegin',`<div class="card row"><div><b>📚 MAPT Fitness Academy</b><br><small>Look up ${ACADEMY_TERMS.length} fitness terms in seconds</small></div><button class="primary" onclick="academyOpen()">Learn →</button></div>`)};
const academyProgramsOriginal=programs;programs=function(){academyProgramsOriginal();$('app').insertAdjacentHTML('afterbegin',`<div class="card row"><div><b>📖 Fitness Dictionary</b><br><small>Supersets, hypertrophy, aerobic fitness and more</small></div><button class="secondary" onclick="academyOpen()">Open →</button></div>`)};
const academyProfileOriginal=profile;profile=function(){academyProfileOriginal();$('app').insertAdjacentHTML('beforeend',`<div class="card"><h2>Fitness Academy</h2><p class="notice">Dictionary favourites are saved separately on this device. Workout backups do not include them.</p><button class="secondary" onclick="academyOpen()">Open dictionary</button></div>`)};
const academyNavigateOriginal=navigate;navigate=function(t){if(t==='academy'){academyOpen();return}academyNavigateOriginal(t)};
const academyRenderOriginal=render;render=function(){if(tab==='academy'){academyList();return}academyRenderOriginal()};


// MAPT 1.5: contextual glossary, accessible learning popup, and daily tip.
const MAPT_LEARN_LINKS={
 'training volume':'Training volume','volume':'Training volume','estimated 1rm':'Estimated 1RM',
 'sets logged':'Sets','completed sets':'Sets','reps':'Repetitions (reps)',
 'weight per dumbbell':'Training volume','rest periods':'Rest interval',
 'strength':'Muscular strength','progressive overload':'Progressive overload',
 'rpe':'Rate of perceived exertion (RPE)','rir':'Repetitions in reserve (RIR)',
 'range of motion':'Range of motion (ROM)','concentric':'Concentric contraction',
 'eccentric':'Eccentric contraction','superset':'Superset',
 'cardiovascular fitness':'Cardiovascular fitness','hypertrophy':'Hypertrophy'
};
function maptFindTerm(label){
 const q=String(label).toLowerCase().trim();
 const name=MAPT_LEARN_LINKS[q];
 return name?ACADEMY_TERMS.find(x=>x.term===name):null;
}
function maptInfo(label){
 const x=maptFindTerm(label);if(!x)return '';
 return `<button type="button" class="learn-trigger" aria-label="Learn about ${esc(label)}" onclick="maptShowLearn(${JSON.stringify(x.term).replace(/"/g,'&quot;')})">ⓘ</button>`;
}
let maptLearnReturnFocus=null;
function maptShowLearn(term){
 const x=ACADEMY_TERMS.find(t=>t.term===term);if(!x)return;
 maptLearnReturnFocus=document.activeElement;
 document.getElementById('maptLearnOverlay')?.remove();
 const level=typeof coachLevel!=='undefined'?coachLevel:'beginner';
 const advanced=level==='intermediate'||level==='advanced';
 const node=document.createElement('div');node.id='maptLearnOverlay';node.className='learn-overlay';
 node.setAttribute('role','presentation');
 node.innerHTML=`<section class="learn-dialog" role="dialog" aria-modal="true" aria-labelledby="maptLearnTitle"><div class="row"><span class="tag">📚 Tap to Learn</span><button type="button" class="learn-close" onclick="maptCloseLearn()" aria-label="Close explanation">✕ Close</button></div><h2 id="maptLearnTitle">${esc(x.term)}</h2><p>${esc(x.simple)}</p><p><b style="color:var(--gold)">Gym example:</b> ${esc(x.example)}</p>${advanced?`<p class="muted">${esc(x.detail)}</p>`:''}<button type="button" class="primary learn-more" onclick="maptLearnMore(${JSON.stringify(x.term).replace(/"/g,'&quot;')})">📖 Learn more in Fitness Academy →</button></section>`;
 node.addEventListener('click',e=>{if(e.target===node)maptCloseLearn()});
 document.body.appendChild(node);node.querySelector('.learn-close').focus();
}
function maptCloseLearn(){document.getElementById('maptLearnOverlay')?.remove();if(maptLearnReturnFocus?.isConnected)maptLearnReturnFocus.focus()}
function maptLearnMore(term){maptCloseLearn();academyDetail(term);window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('maptLearnOverlay'))maptCloseLearn();if(e.key==='Tab'){const d=document.querySelector('#maptLearnOverlay .learn-dialog');if(!d)return;const buttons=[...d.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});
// Decorate only known text labels, never user input or Academy definitions.
function maptDecorateLearn(){
 if(tab==='academy')return;
 const app=document.getElementById('app');if(!app)return;
 const allowed=['training volume','7-day volume','completed volume','estimated 1rm','best estimated 1rm','sets logged','reps','weight per dumbbell','strength by exercise'];
 const walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);
 const targets=[];
 while(walker.nextNode()){
  const n=walker.currentNode,p=n.parentElement;if(!p||p.closest('button,input,select,textarea,script,style,.learn-tip,.learn-trigger'))continue;
  const label=n.nodeValue.trim().toLowerCase();if(allowed.includes(label))targets.push({n,label});
 }
 for(const {n,label} of targets){
  const lookup=label==='7-day volume'||label==='completed volume'?'training volume':label==='best estimated 1rm'?'estimated 1rm':label==='strength by exercise'?'strength':label;
  if(!maptFindTerm(lookup))continue;
  const span=document.createElement('span');span.innerHTML=esc(n.nodeValue)+maptInfo(lookup);n.replaceWith(span);
 }
}
const MAPT_DAILY_TIPS=[
 {title:'Progressive overload',body:'Adding weight is not the only way to progress. Extra repetitions, more quality sets or better technique can also increase training demands.',term:'Progressive overload'},
 {title:'Recovery',body:'Your body adapts between training sessions. Sleep, nutrition and suitable recovery time all support consistent training.',term:'Recovery'},
 {title:'Aerobic fitness',body:'Comfortable, sustained activity can help build an aerobic base that supports both everyday health and harder training.',term:'Aerobic exercise'},
 {title:'Training volume',body:'A simple way to measure resistance-training work is completed repetitions multiplied by the load lifted.',term:'Training volume'},
 {title:'Repetitions in reserve',body:'You do not need to take every set to failure. Estimating how many good repetitions you have left can help manage effort.',term:'Repetitions in reserve (RIR)'},
 {title:'Consistency',body:'A manageable plan you can repeat often beats a perfect plan you cannot sustain.',term:'Training frequency'},
 {title:'Range of motion',body:'Use a controlled range of motion suited to the exercise and your capabilities; technique matters more than chasing numbers.',term:'Range of motion (ROM)'}
];
const maptHomeBeforeTips=home;
home=function(){maptHomeBeforeTips();const d=new Date(),key=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000;const t=MAPT_DAILY_TIPS[((key%MAPT_DAILY_TIPS.length)+MAPT_DAILY_TIPS.length)%MAPT_DAILY_TIPS.length];$('app').insertAdjacentHTML('afterbegin',`<div class="card learn-tip"><h2 style="margin:0 0 8px">💡 Fitness Tip of the Day</h2><b>${esc(t.title)}</b> ${maptInfo(t.term)}<p class="muted">${esc(t.body)}</p></div>`)};
const maptRenderBeforeLearn=render;
render=function(){maptRenderBeforeLearn();maptDecorateLearn()};

render();
</script></body></html>
