<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>MAPT Performance</title><style>
:root{color-scheme:dark;--bg:#0d0f13;--card:#1b1e25;--gold:#e5bb67;--text:#f4f4f5;--muted:#a5a8b0;--line:#333741}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px 20px 12px;display:flex;align-items:center;gap:12px}.mark{color:var(--gold);font-size:34px}.brand{font-weight:900;letter-spacing:2px;font-size:20px}.brand span{color:var(--gold)}small,.muted{color:var(--muted)}main{max-width:700px;margin:auto;padding:10px 18px 110px}h1{font-size:29px;margin:8px 0 4px}h2{font-size:19px;margin:24px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric strong{font-size:24px;color:var(--gold);display:block;margin-top:9px}.metric small{font-size:12px}.primary{background:var(--gold);color:#181818;border:0;font-weight:800;border-radius:12px;padding:13px 17px}.secondary{background:#2a2e37;color:var(--text);border:1px solid #484d57;border-radius:12px;padding:11px 14px}.danger{color:#ff9898}button:disabled{opacity:.4}input,select{background:#101217;color:white;border:1px solid #454a54;border-radius:9px;padding:10px;min-width:0;width:100%}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row>*{min-width:0}.stack{display:flex;flex-direction:column;gap:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#16191f;border-top:1px solid #343841;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:2}.nav button{background:none;border:0;color:var(--muted);font-size:12px;min-width:65px}.nav button.active{color:var(--gold);font-weight:800}.nav .ico{display:block;font-size:22px;margin-bottom:4px}.tag{background:#363123;color:var(--gold);padding:5px 9px;border-radius:99px;font-size:12px}.exercise{border-top:1px solid var(--line);padding:14px 0}.set{display:grid;grid-template-columns:34px 1fr 1fr 62px;gap:8px;align-items:center;margin:8px 0}.set input{text-align:center;padding:9px 3px}.set button{border:1px solid #60666e;background:#282c33;color:white;border-radius:9px;height:40px}.set button.done{background:#45644b;border-color:#85be8c}.notice{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.chart{display:flex;gap:7px;align-items:end;height:160px;border-bottom:1px solid #555;margin:15px 0 8px}.bar{flex:1;min-width:7px;background:linear-gradient(#f4d492,#a67b32);border-radius:5px 5px 0 0}.chart-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.pill{display:inline-block;padding:6px 10px;background:#2d313b;border-radius:8px;font-size:12px;margin:3px}.empty{text-align:center;padding:25px 10px;color:var(--muted)}

</style></head><body><header><div class="mark">✥</div><div><div class="brand">MAPT <span>PERFORMANCE</span></div><small>TRAIN • TRACK • PROGRESS</small></div></header><main id="app"></main><nav class="nav" id="nav"></nav><script>
const KEY='mapt-performance-v1';const starter=[{id:'push',name:'Push Day',items:[{id:'bench',sets:3,reps:8,weight:80},{id:'ohp',sets:3,reps:8,weight:50},{id:'incline',sets:3,reps:10,weight:30}]},{id:'legs',name:'Leg Day',items:[{id:'squat',sets:4,reps:6,weight:120},{id:'rdl',sets:3,reps:10,weight:36},{id:'legpress',sets:3,reps:12,weight:155}]}];const library=[['bench','Barbell Bench Press','Chest',1],['ohp','Overhead Press','Shoulders',1],['incline','Incline Dumbbell Press','Chest',2],['squat','Barbell Squat','Legs',1],['rdl','Dumbbell Romanian Deadlift','Legs',2],['legpress','Leg Press','Legs',1],['deadlift','Deadlift','Back',1],['latpulldown','Lat Pulldown','Back',1],['row','Seated Cable Row','Back',1],['curl','Dumbbell Curl','Arms',2],['pushdown','Triceps Pushdown','Arms',1],['lateral','Dumbbell Lateral Raise','Shoulders',2]].map(([id,name,group,mult])=>({id,name,group,mult}));let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{programs:starter,library,history:[],active:null};state.library ||= library;state.programs ||= starter;state.history ||= [];let tab='home',editing=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),ex=id=>state.library.find(e=>e.id===id)||{name:'Unknown',mult:1,group:'Other'},fmt=n=>Number(n||0).toLocaleString('en-AU',{maximumFractionDigits:1}),uid=()=>Math.random().toString(36).slice(2,10),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function volume(w){return w.items.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(s.done?Number(s.reps)*Number(s.weight)*ex(e.id).mult:0),0),0)}function setsDone(w){return w.items.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0)}function navigate(t){tab=t;render()}function render(){let tabs=[['home','⌂','Home'],['programs','▤','Programs'],['train','◉','Train'],['analytics','▥','Analytics'],['profile','⚙','Profile']];$('nav').innerHTML=tabs.map(([id,icon,name])=>`<button class="${tab===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${icon}</span>${name}</button>`).join('');({home,programs,train,analytics,profile})[tab]();}function heading(title,subtitle=''){return `<h1>${title}</h1><p class="muted">${subtitle}</p>`}function home(){let hist=state.history,now=Date.now(),week=hist.filter(w=>now-new Date(w.date).getTime()<7*864e5),vol=week.reduce((a,w)=>a+volume(w),0),all=hist.reduce((a,w)=>a+setsDone(w),0);$('app').innerHTML=heading('Your performance','Build strength. See the progress.')+`<div class="grid"><div class="card metric"><small>7-day volume</small><strong>${fmt(vol)} kg</strong></div><div class="card metric"><small>7-day sessions</small><strong>${week.length}</strong></div><div class="card metric"><small>Completed workouts</small><strong>${hist.length}</strong></div><div class="card metric"><small>Sets logged</small><strong>${all}</strong></div></div><div class="card"><h2 style="margin-top:0">Ready to train?</h2><p class="muted">Start a saved routine or continue where you left off.</p><button class="primary" onclick="navigate('train')">${state.active?'Continue workout':'Start workout'} →</button></div><h2>Recent workouts</h2>${hist.length?hist.slice(-5).reverse().map(w=>`<div class="card row"><div><b>${esc(w.name)}</b><br><small>${new Date(w.date).toLocaleDateString('en-AU')} · ${setsDone(w)} sets</small></div><strong style="color:var(--gold)">${fmt(volume(w))} kg</strong></div>`).join(''):'<div class="card empty">No workouts yet. Your first session will appear here.</div>'}`}
function programs(){let options=state.library.map(e=>`<option value="${esc(e.id)}">${esc(e.name)} (${esc(e.group)})</option>`).join('');$('app').innerHTML=heading('My programs','Build your routine, your way.')+`<div class="card"><label>New program name</label><div class="row"><input id="newProgram" placeholder="e.g. Upper Body"><button class="primary" onclick="addProgram()">Add</button></div></div>`+state.programs.map(p=>`<div class="card"><div class="row"><h2 style="margin:0">${esc(p.name)}</h2><button class="secondary danger" onclick="deleteProgram('${p.id}')">Delete</button></div>${p.items.map((item,i)=>`<div class="exercise"><b>${esc(ex(item.id).name)}</b><div class="row"><div style="flex:1"><label>Sets</label><input type="number" min="1" max="15" value="${item.sets}" onchange="editItem('${p.id}',${i},'sets',this.value)"></div><div style="flex:1"><label>Reps</label><input type="number" min="1" value="${item.reps}" onchange="editItem('${p.id}',${i},'reps',this.value)"></div><div style="flex:1"><label>kg / unit</label><input type="number" min="0" step="0.5" value="${item.weight}" onchange="editItem('${p.id}',${i},'weight',this.value)"></div><button class="secondary danger" style="margin-top:22px" onclick="removeItem('${p.id}',${i})">×</button></div></div>`).join('')}<label>Add exercise</label><div class="row"><select id="sel-${p.id}">${options}</select><button class="secondary" onclick="addItem('${p.id}')">Add</button></div><p><button class="primary" onclick="start('${p.id}')">Start this workout →</button></p></div>`).join('')+`<div class="card"><h2 style="margin:0">Custom exercise</h2><label>Name</label><input id="customName" placeholder="Exercise name"><label>Muscle group</label><select id="customGroup"><option>Chest</option><option>Back</option><option>Legs</option><option>Shoulders</option><option>Arms</option><option>Core</option><option>Other</option></select><label>Equipment</label><select id="customMult"><option value="1">Barbell / machine / total weight</option><option value="2">Two dumbbells (weight per hand)</option></select><p><button class="secondary" onclick="addCustom()">Save exercise</button></p></div>`}
function addProgram(){let name=$('newProgram').value.trim();if(!name)return alert('Enter a program name');state.programs.push({id:uid(),name,items:[]});save();render()}function deleteProgram(id){if(!confirm('Delete this program? Saved workout history will remain.'))return;state.programs=state.programs.filter(p=>p.id!==id);save();render()}function editItem(id,i,key,v){let item=state.programs.find(p=>p.id===id).items[i];item[key]=Math.max(key==='weight'?0:1,Number(v)||0);save()}function removeItem(id,i){state.programs.find(p=>p.id===id).items.splice(i,1);save();render()}function addItem(id){state.programs.find(p=>p.id===id).items.push({id:$('sel-'+id).value,sets:3,reps:10,weight:0});save();render()}function addCustom(){let name=$('customName').value.trim();if(!name)return alert('Enter an exercise name');state.library.push({id:uid(),name,group:$('customGroup').value,mult:Number($('customMult').value)});save();render()}
function start(id){if(state.active&&!confirm('Discard your current unfinished workout?'))return;let p=state.programs.find(p=>p.id===id);state.active={id:uid(),name:p.name,started:new Date().toISOString(),items:p.items.map(item=>({id:item.id,sets:Array.from({length:item.sets},()=>({reps:item.reps,weight:item.weight,done:false}))}))};save();navigate('train')}function train(){if(!state.active){$('app').innerHTML=heading('Start training','Choose a routine to begin.')+(state.programs.length?state.programs.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><br><small>${p.items.length} exercises</small></div><button class="primary" onclick="start('${p.id}')">Start</button></div>`).join(''):'<div class="card empty">Create a program first.</div>');return}let w=state.active;$('app').innerHTML=heading(w.name,'Active workout · log completed sets')+`<div class="card row"><div><small>Completed volume</small><br><strong style="font-size:23px;color:var(--gold)">${fmt(volume(w))} kg</strong></div><span class="tag">${setsDone(w)} sets logged</span></div>`+w.items.map((item,i)=>`<div class="card"><h2 style="margin:0">${esc(ex(item.id).name)}</h2><small>${esc(ex(item.id).group)} · ${ex(item.id).mult===2?'Weight per dumbbell':'Total loaded weight'}</small><div class="set"><small>Set</small><small>Reps</small><small>Weight kg</small><small>Done</small></div>${item.sets.map((s,j)=>`<div class="set"><b>${j+1}</b><input aria-label="Reps" type="number" min="0" value="${s.reps}" onchange="setValue(${i},${j},'reps',this.value)"><input aria-label="Weight" type="number" min="0" step="0.5" value="${s.weight}" onchange="setValue(${i},${j},'weight',this.value)"><button class="${s.done?'done':''}" onclick="toggleSet(${i},${j})">${s.done?'✓':'○'}</button></div>`).join('')}<button class="secondary" onclick="addSet(${i})">+ Add set</button></div>`).join('')+`<div class="card"><div class="row"><button class="secondary danger" onclick="discard()">Discard</button><button class="primary" onclick="finish()">Finish workout ✓</button></div></div>`}function setValue(i,j,k,v){state.active.items[i].sets[j][k]=Math.max(0,Number(v)||0);save();render()}function toggleSet(i,j){let s=state.active.items[i].sets[j];s.done=!s.done;save();render()}function addSet(i){let sets=state.active.items[i].sets,prev=sets.at(-1)||{reps:10,weight:0};sets.push({...prev,done:false});save();render()}function discard(){if(confirm('Discard this workout?')){state.active=null;save();render()}}function finish(){if(!setsDone(state.active))return alert('Complete at least one set first');let w={...state.active,date:new Date().toISOString()};state.history.push(w);state.active=null;save();navigate('home');alert('Workout saved! Great work.')}function analytics(){let hist=state.history;let days=28,now=Date.now(),weeks=Array.from({length:4},(_,i)=>{let start=now-(4-i)*7*864e5,end=start+7*864e5;return hist.filter(w=>{let t=new Date(w.date).getTime();return t>=start&&t<end}).reduce((a,w)=>a+volume(w),0)}),max=Math.max(1,...weeks);let exerciseIds=[...new Set(hist.flatMap(w=>w.items.map(e=>e.id)))];$('app').innerHTML=heading('Analytics','Your training, measured over time.')+`<div class="card"><h2 style="margin:0">Weekly training volume</h2><small>Last four 7-day periods · kg</small><div class="chart">${weeks.map(v=>`<div class="bar" title="${fmt(v)} kg" style="height:${Math.max(2,v/max*100)}%"></div>`).join('')}</div><div class="chart-labels">${weeks.map((v,i)=>`<span>W${i+1}<br>${fmt(v)} kg</span>`).join('')}</div></div><div class="card"><h2 style="margin:0">Strength by exercise</h2>${exerciseIds.length?`<label>Select exercise</label><select id="analyticsExercise" onchange="strength(this.value)">${exerciseIds.map(id=>`<option value="${id}">${esc(ex(id).name)}</option>`).join('')}</select><div id="strengthOutput"></div>`:'<p class="empty">Log a workout to see strength trends.</p>'}</div><p class="notice">Training volume = completed reps × recorded load. For paired dumbbells, the app counts both dumbbells. Estimated 1RM uses the Epley formula and is an approximation, not a tested maximum.</p>`;if(exerciseIds.length)strength(exerciseIds[0])}function strength(id){let points=state.history.flatMap(w=>w.items.filter(e=>e.id===id).flatMap(e=>e.sets.filter(s=>s.done&&s.reps>0&&s.weight>0).map(s=>({date:w.date,est:s.weight*(1+s.reps/30),weight:s.weight,reps:s.reps}))));let best=points.length?Math.max(...points.map(p=>p.est)):0;let recent=points.slice(-8);$('strengthOutput').innerHTML=points.length?`<p><small>Best estimated 1RM</small><br><strong style="font-size:27px;color:var(--gold)">${fmt(best)} kg</strong></p><div class="chart">${recent.map(p=>`<div class="bar" style="height:${Math.max(2,p.est/best*100)}%" title="${fmt(p.est)} kg"></div>`).join('')}</div><small>Last ${recent.length} completed sets (estimated 1RM)</small>`:'<p class="empty">No completed sets for this exercise.</p>'}function profile(){$('app').innerHTML=heading('Profile & data','Your workouts stay on this device.')+`<div class="card"><h2 style="margin:0">Backup your training</h2><p class="notice">Export regularly. Clearing Safari website data or changing phones can erase locally saved workouts.</p><button class="primary" onclick="exportData()">Export JSON backup</button><label>Restore a backup file</label><input type="file" accept="application/json,.json" id="importFile" onchange="importData(this)"></div><div class="card"><h2 style="margin:0">How tracking works</h2><p class="notice">For dumbbells, enter the weight of ONE dumbbell; paired-dumbbell exercises count both in volume. For barbells and machines, enter the total load. Only checked sets count toward completed training volume.</p><p class="notice">Data is stored in this browser only. This prototype has no account, cloud sync, or server.</p></div><div class="card"><button class="secondary danger" onclick="resetAll()">Delete all app data</button></div>`}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='mapt-performance-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function importData(input){let file=input.files[0];if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.programs)||!Array.isArray(d.history)||!Array.isArray(d.library))throw Error('Invalid backup');if(!confirm('Replace all current data with this backup?'))return;state=d;save();render();alert('Backup restored')}catch(e){alert('Could not import backup: '+e.message)}}function resetAll(){if(confirm('Permanently delete all saved workouts and routines on this device?')){localStorage.removeItem(KEY);location.reload()}}

const LEVELKEY='mapt-performance-coach-level';let coachLevel=localStorage.getItem(LEVELKEY)||'Beginner';let coachQuery='';
function info(id){let e=ex(id),v=COACH[id];return v?{primary:v[0],muscles:v[1],how:v[2],cues:v[3],mistakes:v[4],alternative:v[5],movement:v[6]}:{primary:e.group,muscles:[e.group],how:'Use a controlled range of motion and a load appropriate for your ability. Ask a qualified trainer to demonstrate this exercise.',cues:['Start with a manageable load','Move with control','Stop if you experience pain'],mistakes:['Using more weight than you can control'],alternative:'Ask your trainer for a suitable variation',movement:'Custom exercise'};}
function humanSVG(front,active){let groups=active.map(x=>x.toLowerCase());let on=(...names)=>names.some(n=>groups.some(g=>g.includes(n)))?'#e5bb67':'#46505b';return `<svg viewBox="0 0 150 255" role="img" aria-label="Simplified ${front?'front':'back'} muscle map; highlighted areas indicate relevant muscle groups"><circle cx="75" cy="23" r="17" fill="#66717d"/><path d="M59 42 L91 42 L106 57 L100 133 L90 151 L60 151 L50 133 L44 57 Z" fill="#66717d"/><path d="M49 56 L30 68 L17 132 L27 137 L49 85 Z M101 56 L120 68 L133 132 L123 137 L101 85 Z" fill="${on('arm','bicep','tricep','shoulder')}"/><path d="M60 148 L73 148 L71 232 L56 232 L50 175 Z M77 148 L90 148 L100 175 L94 232 L79 232 Z" fill="${on('leg','quad','hamstring','glute')}"/><path d="M52 60 Q75 51 98 60 L94 88 L75 97 L56 88 Z" fill="${front?on('chest'):on('back','lat')}"/><path d="M57 96 L93 96 L92 126 L58 126 Z" fill="${on('core','ab')}"/><path d="M50 129 L100 129 L91 153 L59 153 Z" fill="${on('glute','leg')}"/><path d="M46 54 L58 48 L61 74 L46 83 Z M92 48 L104 54 L104 83 L89 74 Z" fill="${on('shoulder')}"/><path d="M60 152 L71 152 L70 192 L55 192 Z M79 152 L90 152 L95 192 L80 192 Z" fill="${on('quad','hamstring','leg')}"/><text x="75" y="250" fill="#a5a8b0" text-anchor="middle" font-size="11">${front?'FRONT':'BACK'}</text></svg>`}
function movementSVG(movement){let hinge=/hinge|deadlift/i.test(movement),squat=/squat|leg press/i.test(movement),pull=/pull|row|flexion/i.test(movement);let end=hinge?'M80 45 L95 88 L105 126':squat?'M80 45 L80 92 L102 128':pull?'M80 45 L80 95 L80 128':'M80 45 L80 95 L80 128';return `<svg viewBox="0 0 340 155" role="img" aria-label="Schematic showing start and finish positions, not a full technique demonstration"><g stroke="#69717c" stroke-width="8" stroke-linecap="round" fill="none"><circle cx="70" cy="27" r="13"/><path d="M70 43 L70 92 L53 131 M70 92 L90 131 M70 54 L46 86 M70 54 L92 83"/></g><path d="M145 76 L195 76 M184 65 L195 76 L184 87" stroke="#e5bb67" stroke-width="4" fill="none"/><g stroke="#e5bb67" stroke-width="8" stroke-linecap="round" fill="none"><circle cx="267" cy="27" r="13"/><path d="M267 43 L267 92 L250 131 M267 92 L287 131 ${pull?'M267 54 L244 72 M267 54 L291 72':squat?'M267 54 L245 83 M267 54 L290 83':'M267 54 L252 38 M267 54 L284 38'}"/></g><text x="70" y="151" text-anchor="middle" fill="#a5a8b0" font-size="12">START</text><text x="267" y="151" text-anchor="middle" fill="#e5bb67" font-size="12">FINISH</text></svg>`}
function guide(id,returnTab){let e=ex(id),g=info(id),back=returnTab||'programs';tab='guide';$('nav').innerHTML=`<button onclick="navigate('${back}')">← Back to ${back==='train'?'workout':'library'}</button>`;$('app').innerHTML=`<div class="guide-top"><span class="tag">MAPT EXERCISE COACH · 1.1</span><button class="secondary" onclick="navigate('${back}')">Close ×</button></div><h1>${esc(e.name)}</h1><p class="muted">${esc(g.movement)} · ${esc(e.group)}</p><div class="card"><div class="coach-label">Movement overview</div><div class="guide-visual">${movementSVG(g.movement)}<p>Illustrative movement schematic only — not a video or a substitute for a coached demonstration.</p></div><div class="coach-label">Muscles involved</div><div class="guide-grid"><div class="figure">${humanSVG(true,g.muscles)}</div><div class="figure">${humanSVG(false,g.muscles)}</div></div><p><b>Primary focus:</b> ${esc(g.primary)}<br><small>Relevant groups: ${esc(g.muscles.join(', '))}</small></p><p class="notice">Highlighted regions are simplified educational illustrations, not measured muscle activation.</p></div><div class="card"><div class="coach-label">How to perform</div><p>${esc(g.how)}</p><div class="coach-label">Coaching cues</div><ol class="coach-list">${g.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>${coachLevel!=='Advanced'?`<div class="coach-label">Common mistakes</div><ul class="coach-list">${g.mistakes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="hint"><b>Beginner-friendly alternative:</b> ${esc(g.alternative)}</div>`:''}</div><div class="card"><b>Real technique videos — coming later</b><p class="notice">We'll add real demonstrations when we have permission to use suitable videos. No third-party video is embedded in this version.</p></div>`;}
function libraryPage(){tab='library';$('nav').innerHTML=`<button onclick="navigate('programs')">← Back to programs</button>`;let list=state.library.filter(e=>(e.name+' '+e.group).toLowerCase().includes(coachQuery.toLowerCase()));$('app').innerHTML=heading('Exercise library','Explore technique, muscles and beginner alternatives.')+`<input class="search" aria-label="Search exercises" placeholder="Search exercises or muscle groups" value="${esc(coachQuery)}" oninput="coachQuery=this.value;libraryPage();document.querySelector('.search').focus()"><div class="row"><span class="tag">${list.length} exercises</span><span class="muted">${esc(coachLevel)} mode</span></div>`+list.map(e=>`<div class="card row"><div><b>${esc(e.name)}</b><br><small>${esc(e.group)}</small></div><button class="guide-link" onclick="guide('${e.id}','programs')">ⓘ Guide</button></div>`).join('')+(list.length?'':'<p class="empty">No matching exercises.</p>');}
const oldPrograms=programs;programs=function(){oldPrograms();$('app').insertAdjacentHTML('afterbegin',`<div class="card row"><div><b>Exercise Coach</b><br><small>Visual muscle guides and coaching cues</small></div><button class="primary" onclick="libraryPage()">Explore →</button></div>`);for(const item of $('app').querySelectorAll('.exercise')){let name=item.querySelector('b')?.textContent;let e=state.library.find(x=>x.name===name);if(e)item.insertAdjacentHTML('beforeend',`<button class="guide-link" onclick="guide('${e.id}','programs')">ⓘ Exercise guide</button>`);}}
const oldTrain=train;train=function(){oldTrain();if(!state.active)return;for(const card of $('app').querySelectorAll('.card')){let h=card.querySelector('h2');if(!h)continue;let e=state.library.find(x=>x.name===h.textContent);if(e)h.insertAdjacentHTML('afterend',`<p><button class="guide-link" onclick="guide('${e.id}','train')">ⓘ View technique & muscles</button></p>`);}}
const oldProfile=profile;profile=function(){oldProfile();$('app').insertAdjacentHTML('afterbegin',`<div class="card"><h2 style="margin-top:0">Exercise Coach settings</h2><label>Training experience</label><select onchange="coachLevel=this.value;localStorage.setItem(LEVELKEY,coachLevel);profile()"><option ${coachLevel==='Beginner'?'selected':''}>Beginner</option><option ${coachLevel==='Intermediate'?'selected':''}>Intermediate</option><option ${coachLevel==='Advanced'?'selected':''}>Advanced</option></select><p class="notice">Beginner and intermediate modes include extra technique tips. Advanced mode shows a shorter guide. This setting is stored separately from your workout backup.</p><button class="secondary" onclick="libraryPage()">Open exercise library</button></div>`);}
const oldHome=home;home=function(){oldHome();$('app').insertAdjacentHTML('beforeend',`<div class="card"><h2 style="margin-top:0">New · Exercise Coach</h2><p class="muted">Explore visual muscle maps, technique cues and exercise alternatives.</p><button class="primary" onclick="libraryPage()">Explore exercises →</button></div>`);}


/* MAPT Performance 1.2: non-destructive enhancements; original v1 storage unchanged. */
const FAVKEY='mapt-performance-favourites-v1';
let favourites=[];try{const f=JSON.parse(localStorage.getItem(FAVKEY));if(Array.isArray(f))favourites=f.filter(x=>typeof x==='string')}catch(e){}
let libraryFilter='all';
function isFav(id){return favourites.includes(id)}
function toggleFavourite(id){if(isFav(id))favourites=favourites.filter(x=>x!==id);else favourites.push(id);try{localStorage.setItem(FAVKEY,JSON.stringify(favourites))}catch(e){alert('Could not save favourites on this device.')}if(tab==='guide')guide(id,lastGuideBack);else libraryPage()}
let lastGuideBack='programs';
function favButton(id){return `<button class="fav-btn" aria-label="${isFav(id)?'Remove from':'Add to'} favourites" aria-pressed="${isFav(id)}" onclick="toggleFavourite('${esc(id)}')">${isFav(id)?'★':'☆'}</button>`}
function exerciseRecords(id){return state.history.flatMap(w=>(w.items||[]).filter(i=>i.id===id).flatMap(i=>(i.sets||[]).filter(s=>s.done&&Number(s.weight)>0&&Number(s.reps)>0).map(s=>({date:w.date,weight:Number(s.weight),reps:Number(s.reps),estimated:Number(s.weight)*(1+Number(s.reps)/30)})))).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function progressMarkup(id){let r=exerciseRecords(id),last=r.slice(-12),max=Math.max(1,...last.map(x=>x.estimated));return `<div class="card"><div class="coach-label">Quick progress · last 12 sets</div>${r.length?`<div class="micro-chart" role="img" aria-label="Estimated one-repetition maximum for the last ${last.length} completed sets">${last.map(x=>`<div class="mini-bar" title="${fmt(x.estimated)} kg estimated 1RM" style="height:${Math.max(3,x.estimated/max*100)}%"></div>`).join('')}</div><p class="small-muted">${last.length} completed sets · Latest: ${fmt(last.at(-1).weight)} kg × ${last.at(-1).reps} reps · Best estimated 1RM: ${fmt(Math.max(...r.map(x=>x.estimated)))} kg</p>`:'<p class="muted">Complete a workout with this exercise to see progress here.</p>'}<p class="small-muted">Estimated 1RM uses the Epley formula. Comparisons are most useful when technique and rep ranges are consistent.</p></div>`}
function recentExerciseIds(){let ids=[];for(const w of [...state.history].reverse()){for(const i of w.items||[]){if(!ids.includes(i.id))ids.push(i.id)}}return ids}
function addFavouriteToProgram(id){if(!state.programs.length){alert('Create a program first.');return}let names=state.programs.map((p,i)=>`${i+1}. ${p.name}`).join('\n');let choice=prompt('Add to which program? Enter a number:\n'+names);if(choice===null)return;let index=Number(choice)-1;if(!Number.isInteger(index)||index<0||index>=state.programs.length){alert('Please enter a valid program number.');return}state.programs[index].items.push({id,sets:3,reps:10,weight:0});save();alert('Added to '+state.programs[index].name)}
function renderExerciseLibrary(){tab='library';$('nav').innerHTML=`<button onclick="navigate('programs')">← Back to programs</button>`;let recent=recentExerciseIds(),all=state.library.filter(e=>{let match=(e.name+' '+e.group).toLowerCase().includes(coachQuery.toLowerCase());return match&&(libraryFilter==='all'||(libraryFilter==='favourites'&&isFav(e.id))||(libraryFilter==='recent'&&recent.includes(e.id)))});if(libraryFilter==='recent')all.sort((a,b)=>recent.indexOf(a.id)-recent.indexOf(b.id));$('app').innerHTML=heading('Exercise Coach · 1.2','Real-video-ready guides, favourites and progress.')+`<input class="search" aria-label="Search exercises" placeholder="Search exercises or muscle groups" value="${esc(coachQuery)}" oninput="coachQuery=this.value;renderExerciseLibrary();let f=document.querySelector('.search');f.focus();f.setSelectionRange(f.value.length,f.value.length)"><div class="coach-tools">${[['all','All'],['favourites','★ Favourites'],['recent','Recently performed']].map(([key,name])=>`<button class="filter-btn ${libraryFilter===key?'selected':''}" onclick="libraryFilter='${key}';renderExerciseLibrary()">${name}</button>`).join('')}</div><p class="small-muted">${all.length} exercises · ${esc(coachLevel)} mode</p>`+all.map(e=>`<div class="card coach-item"><div><b>${esc(e.name)}</b><br><small>${esc(e.group)}</small><br><button class="guide-link" onclick="guide('${esc(e.id)}','library')">ⓘ View guide</button></div>${favButton(e.id)}</div>`).join('')+(all.length?'':'<div class="card empty">No exercises found here yet. Try All exercises or complete a workout.</div>');}
libraryPage=renderExerciseLibrary;
const guide11=guide;
guide=function(id,back){lastGuideBack=back||'programs';guide11(id,lastGuideBack);const app=$('app');const top=app.querySelector('.guide-top');if(top){top.querySelector('.tag').textContent='MAPT EXERCISE COACH · 1.2';top.insertAdjacentHTML('beforeend',favButton(id))}const card=app.querySelector('.card');if(card){card.insertAdjacentHTML('beforebegin',`<div class="card"><div class="coach-label">Real trainer demonstration</div><div class="video-placeholder"><div class="play">▶</div><b>Video demonstration not yet available</b><p class="small-muted">We are sourcing licensed real-trainer footage. No unlicensed video has been embedded. Use the written technique guidance below in the meantime.</p></div></div>`)}app.insertAdjacentHTML('beforeend',progressMarkup(id)+`<div class="card"><button class="primary" onclick="addFavouriteToProgram('${esc(id)}')">+ Add to program</button></div>`)};
const profile11=profile;profile=function(){profile11();$('app').insertAdjacentHTML('beforeend',`<div class="card"><h2>Favourites backup</h2><p class="small-muted">Favourites are stored separately from the workout backup in this version. Export this file too if you change devices.</p><button class="secondary" onclick="exportFavourites()">Export favourites</button><label>Restore favourites</label><input type="file" accept="application/json,.json" onchange="importFavourites(event)"></div>`)};
function exportFavourites(){const blob=new Blob([JSON.stringify({version:1,favourites},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mapt-favourites-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importFavourites(event){let file=event.target.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!Array.isArray(obj.favourites)||!obj.favourites.every(x=>typeof x==='string'))throw Error('Invalid favourites file');favourites=[...new Set(obj.favourites)];localStorage.setItem(FAVKEY,JSON.stringify(favourites));alert('Favourites restored.');profile()}catch(e){alert('Could not restore favourites: '+e.message)}}
const home11=home;home=function(){home11();let count=favourites.length;$('app').insertAdjacentHTML('beforeend',`<div class="card"><h2>★ Favourite exercises</h2><p class="muted">${count} saved exercises · Quickly find your guides and progress.</p><button class="secondary" onclick="libraryFilter='favourites';libraryPage()">Open favourites →</button></div>`)};

render();
</script></body></html>
